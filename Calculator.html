<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 400px;
        }

        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 30px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 18px;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #e94560;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(145deg, #e94560, #c23a51);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            padding: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result {
            font-size: 24px;
            color: #fff;
            word-break: break-all;
        }

        #result.error {
            color: #ff6b6b;
            font-size: 18px;
        }

        #result.success {
            color: #4ecca3;
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h1>Калькулятор</h1>

        <div class="inputs">
            <input type="text" id="num1" placeholder="Введите первое число">
            <input type="text" id="num2" placeholder="Введите второе число">
        </div>

        <div class="buttons">
            <button id="sum">Сумма</button>
            <button id="diff">Разность</button>
            <button id="prod">Произведение</button>
            <button id="div">Деление</button>
        </div>

        <div class="result-box">
            <div id="result">Результат</div>
        </div>
    </div>

    <script>
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const resultDisplay = document.getElementById('result');

        // Функция проверки ввода
        function getNumbers() {
            const val1 = num1Input.value.trim();
            const val2 = num2Input.value.trim();

            // Проверяем, что введены числа (целые или дробные, включая отрицательные)
            const num1 = parseFloat(val1);
            const num2 = parseFloat(val2);

            if (val1 === '' || val2 === '' || isNaN(num1) || isNaN(num2)) {
                return { error: 'Ошибка: введите корректные числа!' };
            }

            return { num1, num2 };
        }

        // Функция отображения результата
        function showResult(value, isError = false) {
            resultDisplay.textContent = value;
            resultDisplay.className = isError ? 'error' : 'success';
        }

        // Функция сложения
        function sum(a, b) {
            return a + b;
        }

        // Функция вычитания
        function diff(a, b) {
            return a - b;
        }

        // Функция умножения
        function prod(a, b) {
            return a * b;
        }

        // Функция деления
        function div(a, b) {
            if (b === 0) {
                return 'Ошибка: деление на ноль!';
            }
            return a / b;
        }

        // Обработчики событий для кнопок
        document.getElementById('sum').addEventListener('click', function () {
            const data = getNumbers();
            if (data.error) {
                showResult(data.error, true);
                return;
            }
            showResult(sum(data.num1, data.num2));
        });

        document.getElementById('diff').addEventListener('click', function () {
            const data = getNumbers();
            if (data.error) {
                showResult(data.error, true);
                return;
            }
            showResult(diff(data.num1, data.num2));
        });

        document.getElementById('prod').addEventListener('click', function () {
            const data = getNumbers();
            if (data.error) {
                showResult(data.error, true);
                return;
            }
            showResult(prod(data.num1, data.num2));
        });

        document.getElementById('div').addEventListener('click', function () {
            const data = getNumbers();
            if (data.error) {
                showResult(data.error, true);
                return;
            }
            const res = div(data.num1, data.num2);
            showResult(res, typeof res === 'string');
        });
    </script>

</body>

</html>
