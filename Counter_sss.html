<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .counter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #result {
            font-size: 72px;
            font-weight: bold;
            padding: 30px 60px;
            border-radius: 15px;
            min-width: 150px;
            text-align: center;
            color: #333;
            transition: background-color 0.3s ease;
            background-color: #ff0000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        button {
            font-size: 32px;
            font-weight: bold;
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: linear-gradient(145deg, #ff6b6b, #ee5a24);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: linear-gradient(145deg, #95a5a6, #7f8c8d);
            cursor: not-allowed;
            opacity: 0.6;
        }

        #minus-btn {
            background: linear-gradient(145deg, #00b894, #00a085);
        }

        #plus-btn {
            background: linear-gradient(145deg, #e17055, #d63031);
        }

        #warning {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(145deg, #fdcb6e, #e17055);
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        #warning.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="counter-container">
        <div id="result">0</div>

        <div class="buttons">
            <button id="minus-btn">−</button>
            <button id="plus-btn">+</button>
        </div>

        <div id="warning">вы достигли экстремального значения</div>
    </div>

    <script>
        let count = 0;

        const resultDisplay = document.getElementById('result');
        const plusBtn = document.getElementById('plus-btn');
        const minusBtn = document.getElementById('minus-btn');
        const warning = document.getElementById('warning');

        function updateDisplay() {
            resultDisplay.textContent = count;

            if (count > 0) {
                resultDisplay.style.backgroundColor = '#ffd700'; // жёлтый
            } else if (count < 0) {
                resultDisplay.style.backgroundColor = '#2ecc71'; // зелёный
            } else {
                resultDisplay.style.backgroundColor = '#ff0000'; // красный
            }

            plusBtn.disabled = (count === 10);
            minusBtn.disabled = (count === -10);

            if (count === 10 || count === -10) {
                warning.classList.add('visible');
            } else {
                warning.classList.remove('visible');
            }
        }

        plusBtn.addEventListener('click', function () {
            if (count < 10) {
                count++;
                updateDisplay();
            }
        });

        minusBtn.addEventListener('click', function () {
            if (count > -10) {
                count--;
                updateDisplay();
            }
        });

        updateDisplay();
    </script>

</body>

</html>
